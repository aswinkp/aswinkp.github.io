{{ define "main" }}
<section class="thoughts">
  <h2 class="section-title">Thoughts</h2>
  {{ range .Pages }}
    <article class="entry">
      <span class="date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time></span>
      <div><a class="title" href="{{ .RelPermalink }}">{{ .Title }}</a></div>
    </article>
  {{ end }}
</section>
{{ end }}
